name: Deploy HP to SQA (ontology-hp-sqa)
# Manual only. Builds the branch selected in the "Use workflow from" dropdown
# and deploys it to the standalone Cloud Run service ontology-hp-sqa.
# Never touches the production ontology-service-hp image tags or service.
on:
  workflow_dispatch:
    inputs:
      load:
        description: 'Should load the data?'
        default: true
        type: boolean
env:
  GCLOUD_PROJECT_ID: ${{ secrets.GCLOUD_PROJECT_ID }}
  GCLOUD_REGION: us-east1
  GCLOUD_GCR: us-docker.pkg.dev
  GCLOUD_REGISTRY_PROJECT_ID: ${{ secrets.GCLOUD_REGISTRY_PROJECT_ID }}
  GCLOUD_REGISTRY_IMAGE_ENV: docker
  GCLOUD_REGISTRY_IMAGE_PROJECT: ontology
  ONTOLOGY_SERVICE_ONTOLOGY: hp
  ONTOLOGY_SERVICE_INTERNATIONAL: true
  ONTOLOGY_SERVICE_LOAD: ${{ inputs.load }}
  SERVICE_NAME: ontology-service-hp-sqa

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # No `ref`: checks out the branch the workflow was dispatched from.
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: ${{ runner.os }}-gradle-test-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-test-
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SA_KEY }}'

      - name: Setup Google Cloud CLI
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Set image tag
        run: |
          echo "SERVICE_TAG=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Get ontology data
        run: |
          bash ontology.sh ${ONTOLOGY_SERVICE_ONTOLOGY}

      - name: Docker Login
        run: |
          gcloud auth configure-docker "${GCLOUD_GCR}"

      - name: Build And Push Docker Image
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: |
          export DOCKER_IMAGE=`echo "${GCLOUD_GCR}/${GCLOUD_REGISTRY_PROJECT_ID}/${GCLOUD_REGISTRY_IMAGE_ENV}/${GCLOUD_REGISTRY_IMAGE_PROJECT}/$SERVICE_NAME:$SERVICE_TAG" | sed -e 's#//#/#' -e 's#^/##'`
          echo "DOCKER_IMAGE=$DOCKER_IMAGE" >> $GITHUB_ENV
          ./gradlew check dockerPush --no-daemon

      - name: Set deployment variables
        run: |
          CONFIG=$(jq -r '.[] | select(.prefix=="hp")' config/ontologies.json)
          echo "DEPLOY_MEMORY=$(echo "$CONFIG" | jq -r '.deployment.memory')" >> $GITHUB_ENV
          echo "DEPLOY_CPU=$(echo "$CONFIG" | jq -r '.deployment.cpu')" >> $GITHUB_ENV
          echo "DEPLOY_MIN_INSTANCES=$(echo "$CONFIG" | jq -r '.deployment.min_instances')" >> $GITHUB_ENV
          echo "DEPLOY_MAX_INSTANCES=$(echo "$CONFIG" | jq -r '.deployment.max_instances')" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME --quiet \
            --image "${DOCKER_IMAGE}" --project "${GCLOUD_PROJECT_ID}" \
            --region "${GCLOUD_REGION}" --platform managed --allow-unauthenticated --format json \
            --memory "$DEPLOY_MEMORY" --cpu "$DEPLOY_CPU" --min-instances "$DEPLOY_MIN_INSTANCES" --max-instances "$DEPLOY_MAX_INSTANCES" --no-cpu-throttling --ingress internal-and-cloud-load-balancing --service-account "${GCLOUD_SERVICE_ACCOUNT}"
          echo "Service URL:"
          gcloud run services describe $SERVICE_NAME --project "${GCLOUD_PROJECT_ID}" --region "${GCLOUD_REGION}" --format 'value(status.url)'
